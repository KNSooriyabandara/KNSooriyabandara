name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # ✅ upgrade from v2

      - name: Generate Snake SVG and GIF
        uses: Platane/snk@v3        # ✅ use latest stable version
        with:
          github_user_name: KNSooriyabandara
          svg_out_path: snake.svg
          gif_out_path: snake.gif

      - name: Push Snake files to output branch
        uses: crazy-max/ghaction-github-pages@v3   # ✅ upgrade from v2.1.3
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}