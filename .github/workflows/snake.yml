name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3   # ✅ upgrade from v2

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: KNSooriyabandara
          outputs: |
            dist/snake.svg
          args: --snake_color=#00ff00 --background=#000000

      
      - name: Push Snake files to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
